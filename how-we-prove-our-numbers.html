    <p>A risk platform is only as trustworthy as its numbers. Behind every APY, every risk score, every projection on the yields.digital platform is a chain of computation - and at any link, what the platform <em>claims</em> could quietly diverge from what the code actually <em>does</em>. We decided that "trust us" was not good enough for the kind of clients we serve, so we built a discipline to make every claim <strong>provable</strong> and to keep it that way over time.</p>

    <p>For a retail dashboard, an occasionally-stale number is an annoyance. For an institutional risk platform - one positioning for regulated, professional clients - it is something else entirely. The numbers we show flow into investment decisions, internal risk reporting, and compliance documentation. <strong>Accuracy is not cosmetic; it is the product.</strong></p>
    <p>The hard part is that accuracy decays silently. A value travels through many layers between computation and screen, and each layer is a place where the claim can quietly diverge from the computation. We named that divergence <em>drift</em>, and we treat preventing it as a first-class engineering problem rather than something to fix reactively when a client notices.</p>

verify: {
  id: 'verify', icon: '\u{1F50D}', label: 'Independent verification', desc: 'Author, then adversarial re-check',
  section: 'The Method', tagline: 'Nothing ships on its author’s word. Every catalog survives a second, skeptical pass first.',
  content: `
    <p>A catalog is only worth its verification, so we separate two roles and never let one person play both for the same work:</p>
    <ul>

drift: {

// ============ DATA: sidebar order ============
const topicOrder = [
  { id: 'overview', section: 'Start Here' },
  { id: 'why', section: 'Start Here' },
  { id: 'provable', section: 'The Method' },
  { id: 'verify', section: 'The Method' },
  { id: 'drift', section: 'The Method' },
  { id: 'lifecycle', section: 'The Outcome' },
  { id: 'trust', section: 'The Outcome' },
];

// ============ DATA: FAQs (deepest path wins) ============
const faqs = {

// ============ ENGINE ============
const $ = (s) => document.querySelector(s);
let currentPath = 'overview';

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  return h || 'overview';
}
function resolve(path) {
  const [top, child] = path.split('/');
  const page = pages[top];
  if (!page) return { page: pages.overview, child: null, path: 'overview' };
  if (child) {
    const c = (page.children || []).find(x => x.id === path);
    if (c) return { page, child: c, path };
  }
  return { page, child: null, path: top };
}

function renderSidebar() {
  const sb = $('#sidebar');
  let html = '', lastSection = null;
  const activeTop = currentPath.split('/')[0];
  topicOrder.forEach(t => {
    const p = pages[t.id];
    if (t.section !== lastSection) { html += '<h3>' + t.section + '</h3>'; lastSection = t.section; }
    const act = activeTop === t.id ? ' active' : '';
    html += '<button class="topic-item' + act + '" data-go="' + t.id + '"><span class="ico">' + p.icon + '</span><span>' + p.label + '</span></button>';
    if (p.children && activeTop === t.id) {
      p.children.forEach(c => {
        const cact = currentPath === c.id ? ' active' : '';
        html += '<button class="topic-child' + cact + '" data-go="' + c.id + '">' + c.label + '</button>';
      });
    }
  });
  sb.innerHTML = html;
}

function renderCrumbs(page, child) {
  let html = '<a data-go="overview">how-we-prove-our-numbers</a>';
  html += '<span class="sep">/</span>';
  if (child) {
    html += '<a data-go="' + page.id + '">' + page.label + '</a><span class="sep">/</span><span class="here">' + child.label + '</span>';
  } else {
    html += '<span class="here">' + page.label + '</span>';
  }
  $('#crumbs').innerHTML = html;
}

function renderContent(page, child) {
  let html = '';
  if (child) {
    html += '<h2>' + page.icon + ' ' + child.label + '</h2>';
    html += '<div class="tagline">' + page.label + ' &rsaquo; detail page</div>';
    html += child.content;
  } else {
    html += '<h2>' + page.icon + ' ' + page.label + '</h2>';
    html += '<div class="tagline">' + page.tagline + '</div>';
    html += page.content;
    if (page.children && !page.content.includes('data-nav-card')) {
      html += '<div class="nav-grid">' + page.children.map(c =>
        '<div class="nav-card" data-nav-card="' + c.id + '"><div class="nc-t">' + c.label + '</div><div class="nc-d">Drill into the detail.</div></div>'
      ).join('') + '</div>';
    }
    if (page.expandables) {
      html += page.expandables.map((e, i) =>
        '<div class="expand-card" id="ex-' + i + '"><div class="expand-header" data-ex="' + i + '"><span class="ico">' + e.icon + '</span><span class="t">' + e.title + '</span><span class="chev">&#9654;</span></div><div class="expand-body"><div class="expand-body-inner">' + e.detail + '</div></div></div>'
      ).join('');
    }
  }
  $('#content').innerHTML = '<div class="content-inner">' + html + '</div>';
  $('#content').scrollTop = 0;
}

function faqsFor(path) {
  if (faqs[path]) return faqs[path];
  const top = path.split('/')[0];
  return faqs[top] || [];
}
function renderFaq(path) {
  const list = faqsFor(path);
  $('#faq-chips').innerHTML = list.map((f, i) =>
    '<button class="faq-chip" data-faq="' + i + '" title="' + f.q.replace(/"/g, '&quot;') + '">' + f.q + '</button>'
  ).join('') || '<span class="ph" style="font-size:11px;color:var(--chrome-muted)">No questions for this page.</span>';
  $('#faq-answer').innerHTML = '<span class="ph">Select a question above.</span>';
}
function showFaqAnswer(i, list) {
  const f = (list || faqsFor(currentPath))[i];
  if (!f) return;
  document.querySelectorAll('.faq-chip').forEach((c, j) => c.classList.toggle('active', j === Number(i)));
  $('#faq-answer').innerHTML = '<strong>' + f.q + '</strong><br>' + f.a;
}
let searchResults = null;
function faqSearch(term) {
  term = term.trim().toLowerCase();
  if (!term) { searchResults = null; renderFaq(currentPath); return; }
  searchResults = [];
  Object.keys(faqs).forEach(k => faqs[k].forEach(f => {
    if (f.q.toLowerCase().includes(term) || f.a.toLowerCase().includes(term)) {
      const top = k.split('/')[0];
      searchResults.push({ q: (pages[top] ? pages[top].label + ': ' : '') + f.q, a: f.a });
    }
  }));
  $('#faq-chips').innerHTML = searchResults.slice(0, 8).map((f, i) =>
    '<button class="faq-chip" data-faq="' + i + '" title="' + f.q.replace(/"/g, '&quot;') + '">' + f.q + '</button>'
  ).join('') || '<span class="ph" style="font-size:11px;color:var(--chrome-muted)">No matches.</span>';
  $('#faq-answer').innerHTML = '<span class="ph">' + searchResults.length + ' match(es) across all pages.</span>';
}

function render() {
  const { page, child, path } = resolve(parseHash());
  currentPath = path;
  renderSidebar();
  renderCrumbs(page, child);
  renderContent(page, child);
  if (!searchResults) renderFaq(path);
}

// Navigation + interaction delegation
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); location.hash = '#/' + nav.getAttribute('data-nav'); return; }
  const card = e.target.closest('[data-nav-card]');
  if (card) { location.hash = '#/' + card.getAttribute('data-nav-card'); return; }
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = '#/' + go.getAttribute('data-go'); return; }
  const exh = e.target.closest('.expand-header');
  if (exh) {
    const cardEl = exh.parentElement;
    const body = cardEl.querySelector('.expand-body');
    const open = cardEl.classList.toggle('open');
    body.style.maxHeight = open ? body.scrollHeight + 'px' : '0';
    return;
  }
  const chip = e.target.closest('.faq-chip');
  if (chip) { showFaqAnswer(chip.getAttribute('data-faq'), searchResults); return; }
});

$('#faq-search').addEventListener('input', (e) => faqSearch(e.target.value));

document.addEventListener('keydown', (e) => {
  const inInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
  if (e.key === '/' && !inInput) { e.preventDefault(); $('#faq-search').focus(); }
  if (e.key === 'Backspace' && !inInput) { e.preventDefault(); history.back(); }
});

function setTheme(mode) {
  document.body.classList.toggle('light', mode === 'light');
  document.getElementById('btn-l').classList.toggle('active', mode === 'light');
  document.getElementById('btn-d').classList.toggle('active', mode === 'dark');
}

window.addEventListener('hashchange', () => { searchResults = null; $('#faq-search').value = ''; render(); });
render();
</script>
</body>
</html>
