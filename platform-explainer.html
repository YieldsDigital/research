<html lang="en">
<head>

<title>Yields Digital - Platform Overview</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--muted:#6e7681;--accent:#58a6ff;--green:#3fb950;--orange:#d29922;--red:#f85149;--purple:#bc8cff;--cyan:#39d2c0;--pink:#f778ba;--radius:10px}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6}
body{display:flex;flex-direction:column;overflow:hidden}

/* Header */
.header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.header h1{font-size:17px;font-weight:600}
.header h1 span{color:var(--dim);font-weight:400}
.header .subtitle{font-size:12px;color:var(--muted);margin-left:auto}
.footer{display:flex;align-items:center;justify-content:space-between;padding:6px 24px;border-top:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--muted);flex-shrink:0;letter-spacing:.2px}
.footer .version{font-weight:600;color:var(--dim)}
.footer .updated{color:var(--muted)}

/* Main layout */
.main{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;background:var(--surface);overflow-y:auto}
.sidebar-section{padding:14px 16px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.topic-item{padding:10px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:background .12s;border-left:3px solid transparent}
.topic-item:hover{background:var(--surface2)}
.topic-item.active{background:var(--surface2);border-left-color:var(--accent)}
.topic-item .icon{font-size:18px;flex-shrink:0;width:24px;text-align:center;line-height:1.4}
.topic-item .label{font-size:13px;font-weight:500}
.topic-item .desc{font-size:11px;color:var(--muted);margin-top:2px}
.topic-child{padding:7px 16px 7px 50px;cursor:pointer;font-size:12px;color:var(--dim);transition:all .12s;border-left:3px solid transparent}
.topic-child:hover{background:var(--surface2);color:var(--text)}
.topic-child.active{color:var(--accent);border-left-color:var(--accent);background:var(--surface2)}

/* Content area */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Breadcrumbs */
.breadcrumbs{padding:10px 40px;border-bottom:1px solid var(--border);font-size:13px;color:var(--dim);flex-shrink:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.breadcrumbs a{color:var(--accent);text-decoration:none;cursor:pointer}
.breadcrumbs a:hover{text-decoration:underline}
.breadcrumbs .sep{color:var(--muted);font-size:11px}

/* Visual panel */
.visual-panel{flex:1;overflow-y:auto;padding:32px 40px}
.visual-panel h2{font-size:22px;font-weight:600;margin-bottom:6px}
.visual-panel .tagline{font-size:14px;color:var(--dim);margin-bottom:24px}
.visual-panel h3{font-size:16px;font-weight:600;margin:24px 0 10px;color:var(--accent)}
.visual-panel p{color:var(--dim);margin-bottom:14px;max-width:720px}
.visual-panel ul{padding-left:20px;margin-bottom:14px;color:var(--dim)}
.visual-panel li{margin-bottom:6px}
.visual-panel li strong{color:var(--text)}

/* Cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:16px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .card-icon{font-size:24px;margin-bottom:8px}
.card .card-title{font-size:14px;font-weight:600;margin-bottom:4px}
.card .card-desc{font-size:12px;color:var(--dim);line-height:1.5}

/* Expandable cards */
.expand-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:8px 0;transition:border-color .15s}
.expand-card:hover{border-color:var(--accent)}
.expand-header{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
.expand-header .chevron{color:var(--muted);font-size:12px;transition:transform .2s;flex-shrink:0}
.expand-card.expanded .expand-header .chevron{transform:rotate(90deg)}
.expand-header .card-icon{font-size:20px;flex-shrink:0}
.expand-header .card-title{font-size:14px;font-weight:600;flex:1}
.expand-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.expand-card.expanded .expand-body{max-height:2000px}
.expand-body-inner{padding:0 16px 16px 42px;font-size:13px;color:var(--dim);line-height:1.7}
.expand-body-inner strong{color:var(--text)}
.expand-body-inner p{margin-bottom:8px}

/* Navigable cards */
.nav-card{cursor:pointer;position:relative}
.nav-card::after{content:'→';position:absolute;top:14px;right:14px;color:var(--accent);font-size:14px;opacity:0;transition:opacity .15s}
.nav-card:hover::after{opacity:1}

/* Cross-links */
a[data-nav]{color:var(--accent);text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--accent)}
a[data-nav]:hover{border-bottom-style:solid}
a[data-nav]::after{content:' →';font-size:11px}

/* Flow diagram */
.flow{display:flex;align-items:center;gap:8px;margin:20px 0;flex-wrap:wrap}
.flow-step{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:13px;font-weight:500;text-align:center;min-width:120px}
.flow-arrow{color:var(--muted);font-size:18px}

/* Score bar */
.score-bar{display:flex;align-items:stretch;height:32px;border-radius:6px;overflow:hidden;margin:12px 0 6px;max-width:500px}
.score-segment{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff}
.score-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);max-width:500px;margin-bottom:16px}

/* Risk table */
.risk-table{width:100%;max-width:600px;border-collapse:collapse;margin:12px 0 20px;font-size:13px}
.risk-table th{text-align:left;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.risk-table td{padding:8px 12px;border:1px solid var(--border)}

/* Comparison table */
.compare-table{width:100%;max-width:700px;border-collapse:collapse;margin:12px 0 20px;font-size:13px}
.compare-table th{text-align:left;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--muted)}
.compare-table td{padding:8px 12px;border:1px solid var(--border);text-align:center}
.compare-table td:first-child{text-align:left}
.compare-table .yes{color:var(--green)}
.compare-table .no{color:var(--red)}
.compare-table .partial{color:var(--orange)}

/* FAQ section */
.faq-panel{border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;display:flex;flex-direction:column;height:280px;min-height:180px}
.faq-header{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.faq-header h3{font-size:13px;font-weight:600}
.faq-header .hint{font-size:11px;color:var(--muted);margin-left:auto}
.faq-body{flex:1;overflow-y:auto;padding:12px 20px}
.faq-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.faq-chip{padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--dim);cursor:pointer;transition:all .15s;background:var(--surface2)}
.faq-chip:hover{border-color:var(--accent);color:var(--accent)}
.faq-answer{background:var(--surface2);border-radius:var(--radius);padding:14px 18px;margin-top:10px;font-size:13px;color:var(--dim);line-height:1.6;display:none}
.faq-answer.visible{display:block}
.faq-answer strong{color:var(--text)}
.faq-input-row{display:flex;gap:8px;padding:10px 20px;border-top:1px solid var(--border);flex-shrink:0}
.faq-input{flex:1;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.faq-input:focus{border-color:var(--accent)}
.faq-input::placeholder{color:var(--muted)}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-green{background:rgba(63,185,80,.15);color:var(--green)}
.badge-orange{background:rgba(210,153,34,.15);color:var(--orange)}
.badge-blue{background:rgba(88,166,255,.15);color:var(--accent)}
.badge-purple{background:rgba(188,140,255,.15);color:var(--purple)}
.badge-red{background:rgba(248,81,73,.15);color:var(--red)}

/* Chain tags */
.chain-row{display:flex;gap:16px;margin:12px 0 20px;flex-wrap:wrap}
.chain-tag{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500}

/* Scrollbar */
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--muted)}

.resize-handle{height:4px;cursor:ns-resize;flex-shrink:0}.resize-handle:hover{background:var(--accent)}

/* Diagram styles */
.diagram-container{margin:24px 0;max-width:720px}
.diagram-container svg{width:100%;height:auto;display:block}
.diagram-label{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}

/* Architecture pipeline */
.arch-pipeline{display:flex;align-items:center;gap:0;margin:24px 0;flex-wrap:wrap;max-width:720px}
.arch-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;text-align:center;flex:1;min-width:120px;transition:border-color .2s,transform .2s}
.arch-block:hover{border-color:var(--accent);transform:translateY(-2px)}
.arch-block svg{width:40px;height:40px;margin:0 auto 8px;display:block}
.arch-block .arch-title{font-size:13px;font-weight:600;margin-bottom:2px}
.arch-block .arch-desc{font-size:11px;color:var(--dim)}
.arch-arrow{color:var(--muted);font-size:24px;padding:0 4px;flex-shrink:0}

/* Weight bar chart */
.weight-bar{display:flex;height:36px;border-radius:6px;overflow:hidden;margin:12px 0;max-width:600px}
.weight-bar-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;transition:opacity .2s}
.weight-bar-seg:hover{opacity:.85}
.weight-legend{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 16px;font-size:12px}
.weight-legend-item{display:flex;align-items:center;gap:6px}
.weight-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Gauge */
.gauge-container{position:relative;max-width:320px;margin:16px 0 24px}
.gauge-value{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:700;color:var(--text)}
.gauge-value span{font-size:12px;color:var(--dim);display:block;text-align:center;font-weight:400}

/* Before/after blocks */
.ba-container{display:flex;gap:24px;margin:16px 0 24px;flex-wrap:wrap;max-width:600px}
.ba-card{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.ba-card h4{font-size:13px;font-weight:600;margin-bottom:10px}
.ba-score{font-size:20px;font-weight:700;margin-top:8px}

/* Drawdown bars */
.drawdown-bars{max-width:500px;margin:16px 0 20px}
.drawdown-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.drawdown-label{width:60px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0}
.drawdown-track{flex:1;height:24px;background:var(--surface2);border-radius:4px;overflow:hidden;position:relative}
.drawdown-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:visible;transition:width .5s ease}
.drawdown-severity{font-size:11px;font-weight:500;min-width:60px;text-align:right}

/* Scan pipeline SVG */
.scan-pipeline{margin:16px 0 24px;max-width:720px}

/* Radar chart */
.radar-container{max-width:400px;margin:20px 0}
.radar-legend{display:flex;gap:16px;margin-top:8px;font-size:12px}
.radar-legend-item{display:flex;align-items:center;gap:6px}
.radar-legend-swatch{width:12px;height:12px;border-radius:2px;flex-shrink:0}

/* Donut chart */
.donut-container{position:relative;width:180px;height:180px;margin:16px 0 24px}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-center .pct{font-size:28px;font-weight:700;color:var(--green)}
.donut-center .pct-label{font-size:11px;color:var(--dim)}
.donut-legend{display:flex;gap:16px;margin-top:8px;font-size:12px}
.donut-legend-item{display:flex;align-items:center;gap:6px}
</style>
</head>

  'data-integrity': {
    id: 'data-integrity', icon: '🧮', label: 'Data Integrity', desc: 'How we prove our numbers', section: 'Details',
    tagline: 'Every number traceable to its source.',
    content: `
      <p>Institutional reporting is only as good as the data behind it. Yields Digital runs an internal <strong>data-integrity program</strong> that keeps every reported figure traceable to the exact code and data source that produced it - so any number in a report can be tied back to its origin.</p>
      <p>The platform maintains <strong>documented inventories</strong> of every data surface that feeds a score - the API contracts, screens, and data routes behind the numbers - each pinned to a verified baseline. <strong>Automated drift detection</strong> then flags whenever the code behind a reported figure diverges from that baseline, so the documentation and the live system never quietly fall out of step.</p>
      <p>This is the engineering discipline beneath the <a data-nav="compliance">audit-trail and immutable-evidence commitments</a>. The public <a href="https://yieldsdigital.github.io/research/" target="_blank" rel="noopener">"How We Prove Our Numbers"</a> explainer is the detailed, outward-facing account of how it works.</p>
    `,

      { icon: '📋', title: 'Documented Surface Inventories', detail: 'The data surfaces that feed a score - API contracts, screens, and data routes - are catalogued in living inventory documents, each pinned to a verified code baseline. The inventory is the reference of record for what the platform reports and how it is produced.' },

// ─────────────────────────────────────────────────
// ROUTER
// ─────────────────────────────────────────────────
let currentPath = 'overview';
let navHistory = [];

function navigateTo(path, pushHistory = true) {
  if (pushHistory && currentPath !== path) navHistory.push(currentPath);
  currentPath = path;
  window.location.hash = path;
  renderSidebar(); renderBreadcrumbs(); renderContent(); renderFAQ();
}

function goBack() {
  if (navHistory.length > 0) navigateTo(navHistory.pop(), false);
}

function getParentPath(path) {
  const parts = path.split('/');
  return parts.length > 1 ? parts[0] : null;
}

function getTopLevelId(path) { return path.split('/')[0]; }

function getPageData(path) {
  const parts = path.split('/');
  const topLevel = pages[parts[0]];
  if (!topLevel) return null;
  if (parts.length === 1) return topLevel;
  if (topLevel.children) {
    const child = topLevel.children.find(c => c.id === path);
    if (child) return child;
  }
  return null;
}

// ─────────────────────────────────────────────────
// RENDER: Sidebar
// ─────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('sidebar');
  let html = '', lastSection = '';
  const activeTopLevel = getTopLevelId(currentPath);
  topicOrder.forEach(t => {
    const page = pages[t.id];
    if (!page) return;
    if (t.section !== lastSection) {
      html += `<div class="sidebar-section">${t.section}</div>`;
      lastSection = t.section;
    }
    const isActive = activeTopLevel === t.id;
    html += `<div class="topic-item ${isActive ? 'active' : ''}" data-nav="${t.id}">
      <span class="icon">${page.icon}</span>
      <div><div class="label">${page.label}</div><div class="desc">${page.desc}</div></div>
    </div>`;
    if (isActive && page.children) {
      page.children.forEach(child => {
        html += `<div class="topic-child ${currentPath === child.id ? 'active' : ''}" data-nav="${child.id}">${child.label}</div>`;
      });
    }
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-nav]').forEach(item => {
    item.addEventListener('click', () => navigateTo(item.dataset.nav));
  });
}

// ─────────────────────────────────────────────────
// RENDER: Breadcrumbs
// ─────────────────────────────────────────────────
function renderBreadcrumbs() {
  const el = document.getElementById('breadcrumbs');
  const parts = currentPath.split('/');
  let crumbs = [{label: 'Home', path: 'overview'}];
  if (parts[0] !== 'overview') {
    const topPage = pages[parts[0]];
    if (topPage) crumbs.push({label: topPage.label, path: parts[0]});
  }
  if (parts.length > 1) {
    const pageData = getPageData(currentPath);
    if (pageData) crumbs.push({label: pageData.label, path: currentPath});
  }
  el.innerHTML = crumbs.map((c, i) => {
    if (i === crumbs.length - 1) return `<span>${c.label}</span>`;
    return `<a data-nav="${c.path}">${c.label}</a><span class="sep">›</span>`;
  }).join('');
  el.querySelectorAll('[data-nav]').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); navigateTo(a.dataset.nav); });
  });
}

// ─────────────────────────────────────────────────
// RENDER: Content
// ─────────────────────────────────────────────────
function renderContent() {
  const panel = document.getElementById('visualPanel');
  const pageData = getPageData(currentPath);
  if (!pageData) { panel.innerHTML = '<p>Page not found.</p>'; panel.scrollTop = 0; return; }

  let html = `<h2>${pageData.label || pageData.title}</h2>`;
  if (pageData.tagline) html += `<p class="tagline">${pageData.tagline}</p>`;
  html += pageData.content || '';
  if (pageData.expandables && pageData.expandables.length > 0) html += renderExpandables(pageData.expandables);
  if (pageData.children && pageData.children.length > 0) {
    html += '<div class="cards">';
    pageData.children.forEach(child => {
      html += `<div class="card nav-card" data-nav="${child.id}"><div class="card-title">${child.label}</div><div class="card-desc" style="color:var(--dim)">Click to explore</div></div>`;
    });
    html += '</div>';
  }
  panel.innerHTML = html;
  panel.scrollTop = 0;
  panel.querySelectorAll('.expand-header').forEach(h => h.addEventListener('click', () => h.parentElement.classList.toggle('expanded')));
  panel.querySelectorAll('.nav-card[data-nav]').forEach(c => c.addEventListener('click', () => navigateTo(c.dataset.nav)));
  panel.querySelectorAll('a[data-nav]').forEach(l => l.addEventListener('click', e => { e.preventDefault(); navigateTo(l.dataset.nav); }));
}

function renderExpandables(items) {
  return items.map(item => `
    <div class="expand-card">
      <div class="expand-header">
        <span class="chevron">▸</span>
        <span class="card-icon">${item.icon}</span>
        <span class="card-title">${item.title}</span>
      </div>
      <div class="expand-body">
        <div class="expand-body-inner">${item.detail}</div>
      </div>
    </div>
  `).join('');
}

// ─────────────────────────────────────────────────
// RENDER: FAQ
// ─────────────────────────────────────────────────
function renderFAQ() {
  const chips = document.getElementById('faqChips');
  const answer = document.getElementById('faqAnswer');
  let topicFaqs = faqs[currentPath] || faqs[getTopLevelId(currentPath)] || [];
  chips.innerHTML = topicFaqs.map((f,i) => `<div class="faq-chip" data-idx="${i}">${f.q}</div>`).join('');
  answer.classList.remove('visible'); answer.innerHTML = '';
  chips.querySelectorAll('.faq-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const f = topicFaqs[parseInt(chip.dataset.idx)];
      answer.innerHTML = `<strong style="color:var(--text);display:block;margin-bottom:6px">${f.q}</strong>${f.a}`;
      answer.classList.add('visible');
      chips.querySelectorAll('.faq-chip').forEach(c => c.style.borderColor = '');
      chip.style.borderColor = 'var(--accent)';
      answer.querySelectorAll('a[data-nav]').forEach(l => l.addEventListener('click', e => { e.preventDefault(); navigateTo(l.dataset.nav); }));
    });
  });
}

// ─────────────────────────────────────────────────
// Free-text search
// ─────────────────────────────────────────────────
document.getElementById('faqInput').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  let bestMatch = null, bestScore = 0;
  Object.entries(faqs).forEach(([topic, list]) => {
    list.forEach(f => {
      const words = q.split(/\s+/);
      const target = (f.q + ' ' + f.a).toLowerCase();
      let score = 0;
      words.forEach(w => { if (w.length > 2 && target.includes(w)) score++; });
      if (score > bestScore) { bestScore = score; bestMatch = {...f, topic}; }
    });
  });
  const answer = document.getElementById('faqAnswer');
  if (bestMatch && bestScore >= 1) {
    if (bestMatch.topic !== currentPath && getTopLevelId(bestMatch.topic) !== getTopLevelId(currentPath)) navigateTo(bestMatch.topic);
    answer.innerHTML = `<strong style="color:var(--text);display:block;margin-bottom:6px">${bestMatch.q}</strong>${bestMatch.a}`;
    answer.classList.add('visible');
  } else {
    answer.innerHTML = `<strong style="color:var(--text);display:block;margin-bottom:6px">No exact match found</strong>Try browsing the topics on the left, or rephrase your question.`;
    answer.classList.add('visible');
  }
  e.target.value = '';
});

// ─────────────────────────────────────────────────
// Resize handle
// ─────────────────────────────────────────────────
const rh = document.getElementById('resizeHandle');
let resizing = false, resizeY = 0, startH = 0;
rh.addEventListener('mousedown', e => { resizing = true; resizeY = e.clientY; startH = document.getElementById('faqPanel').offsetHeight; e.preventDefault(); });
window.addEventListener('mousemove', e => { if (!resizing) return; document.getElementById('faqPanel').style.height = Math.max(100, startH + (resizeY - e.clientY)) + 'px'; });
window.addEventListener('mouseup', () => { resizing = false; });

// ─────────────────────────────────────────────────
// Keyboard navigation
// ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (document.activeElement === document.getElementById('faqInput')) return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('faqInput').focus(); return; }
  if (e.key === 'Backspace' || (e.altKey && e.key === 'ArrowLeft')) {
    e.preventDefault();
    const parent = getParentPath(currentPath);
    if (parent) navigateTo(parent); else goBack();
    return;
  }
  const topLevelId = getTopLevelId(currentPath);
  const parts = currentPath.split('/');
  if (parts.length === 1) {
    const idx = topicOrder.findIndex(t => t.id === currentPath);
    if ((e.key === 'ArrowDown' || e.key === 'j') && idx < topicOrder.length - 1) { e.preventDefault(); navigateTo(topicOrder[idx + 1].id); }
    if ((e.key === 'ArrowUp' || e.key === 'k') && idx > 0) { e.preventDefault(); navigateTo(topicOrder[idx - 1].id); }
  } else {
    const parentPage = pages[topLevelId];
    if (parentPage && parentPage.children) {
      const idx = parentPage.children.findIndex(c => c.id === currentPath);
      if ((e.key === 'ArrowDown' || e.key === 'j') && idx < parentPage.children.length - 1) { e.preventDefault(); navigateTo(parentPage.children[idx + 1].id); }
      if ((e.key === 'ArrowUp' || e.key === 'k') && idx > 0) { e.preventDefault(); navigateTo(parentPage.children[idx - 1].id); }
    }
  }
});

// ─────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────
window.addEventListener('hashchange', () => {
  const hash = window.location.hash.replace('#', '');
  if (hash && hash !== currentPath) navigateTo(hash, true);
});
const initHash = window.location.hash.replace('#', '');
if (initHash && getPageData(initHash)) currentPath = initHash;
renderSidebar(); renderBreadcrumbs(); renderContent(); renderFAQ();
</script>
